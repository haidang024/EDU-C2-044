[project]
name = "edu-c2-044"
version = "1.0.1"
description = "Academic Integrity Evidence Triage Agent — produces a RESTRICTED evidence briefing for authorized integrity review officers."
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# installed from the package registry by CI. Pinning it here would make
# `pip install -e .` fail because it is not resolvable from the default index.
# pyyaml is required for runtime config loading and PB-7 applicability checks.
dependencies = [
    "agenticstar-agentcore[marketplace,openai,platform-rag,platform-memory,platform-db,platform-storage-azure]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
disallow_any_generics = false
disallow_subclassing_any = false
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "tests.conftest"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
