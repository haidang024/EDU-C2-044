# Agent Manifest — AgentRegistry entry point for EDU-C2-044.
# Static discovery metadata lives here; runtime parameters live in config/config.yaml.
id: "EDU-C2-044"
name: "Academic Integrity Evidence Triage Agent"
namespace: "agent1000"
version: "1.0.1"
enabled: true
category: "Cat 2"
generation_mode: "llm"
industry: "EDU"

# Opaque compatibility metadata; this is not an inheritance selector.
base_type: "AgentBaseGraph"

# AgentRegistry expects one dotted import path.
class: "src.graph.graph.Graph"

required_trust_level: "VERIFIED_EXTERNAL"

# Domain connector and Azure OpenAI secrets are accessed per invocation.
requires:
  secrets:
    - "OFFICER_REGISTRY_API_KEY"
    - "POLICY_RAG_API_KEY"
    - "PRIOR_CASE_RAG_API_KEY"
    - "AZURE_OPENAI_API_KEY"
    - "AZURE_OPENAI_ENDPOINT"
    - "AZURE_OPENAI_DEPLOYMENT"
  extras: ["openai"]
