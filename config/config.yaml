# Runtime parameters — loaded separately from config/agent.yaml and passed as
# Graph(config=...).
max_retry: 3
timeout_s: 30
memory_enabled: false
llm_provider: "azure_openai"

hitl:
  enabled: false

retrieval:
  policy_collection: "policy_corpus"
  prior_case_collection: "prior_case_corpus"
  max_policy_results: 5
  max_prior_case_results: 3

input:
  max_chars: 4000

output:
  classification: "RESTRICTED"
  human_review_required: true
